# Distributed lane — Universal Gateway role OVERLAY.
# Merged onto gateway/modules/distribution/product/src/main/conf/deployment.toml.
# Adds the shared DB, points key-manager + event-hub at the ACP, and throttling at the Traffic Manager.

[server]
hostname = "gateway"

# apim_db holds the identity tables (IDP/IDN_*) — the GW needs the SHARED apim_db (not a local H2) so it can
# resolve a tenant's resident Identity Provider when deploying tenant APIs. Without this, tenant-API deploy
# fails on the GW with "Could not find Resident Identity Provider for tenant <x>" (super-tenant is
# bootstrapped at startup and masks the gap).
[database.apim_db]
type = "mysql"
url = "jdbc:mysql://mysql:3306/WSO2AM_DB?autoReconnect=true&amp;allowPublicKeyRetrieval=true&amp;useSSL=false"
username = "wso2carbon"
password = "wso2carbon"
driver = "com.mysql.cj.jdbc.Driver"

[database.shared_db]
type = "mysql"
url = "jdbc:mysql://mysql:3306/WSO2AM_SHARED_DB?autoReconnect=true&amp;allowPublicKeyRetrieval=true&amp;useSSL=false"
username = "wso2carbon"
password = "wso2carbon"
driver = "com.mysql.cj.jdbc.Driver"

[apim.key_manager]
service_url = "https://acp:9443/services/"
username = "$ref{super_admin.username}"
password = "$ref{super_admin.password}"

[apim.event_hub]
enable = true
username = "$ref{super_admin.username}"
password = "$ref{super_admin.password}"
service_url = "https://acp:9443/services/"
event_listening_endpoints = ["tcp://acp:5672"]

[apim.sync_runtime_artifacts.gateway]
gateway_labels = ["Default"]

[apim.throttling]
throttle_decision_endpoints = ["tcp://trafficmanager:5672"]

[[apim.throttling.url_group]]
traffic_manager_urls = ["tcp://trafficmanager:9611"]
traffic_manager_auth_urls = ["ssl://trafficmanager:9711"]
