# Distributed lane — API Control Plane role OVERLAY.
#
# NOT a full config: merged (Utils.mergeToml -> deepMerge) ONTO the api-control-plane distribution
# deployment.toml (api-control-plane/modules/distribution/product/src/main/conf/deployment.toml), so it
# inherits every distribution default (keystores, super_admin, transport, oauth token types, ...) and only
# adds/overrides the cluster wiring below. deepMerge REPLACES arrays-of-tables wholesale, so the single
# [[apim.gateway.environment]] here fully supplants the distribution's (no duplicate environment).
#
# Fixed-topology note: cluster peers are reached by stable network aliases on canonical ports, so values
# are literal (no $env{} indirection needed — the cluster owns its mysql sidecar).

[server]
hostname = "acp"

[database.apim_db]
type = "mysql"
url = "jdbc:mysql://mysql:3306/WSO2AM_DB?autoReconnect=true&amp;allowPublicKeyRetrieval=true&amp;useSSL=false"
username = "wso2carbon"
password = "wso2carbon"
driver = "com.mysql.cj.jdbc.Driver"

[database.shared_db]
type = "mysql"
url = "jdbc:mysql://mysql:3306/WSO2AM_SHARED_DB?autoReconnect=true&amp;allowPublicKeyRetrieval=true&amp;useSSL=false"
username = "wso2carbon"
password = "wso2carbon"
driver = "com.mysql.cj.jdbc.Driver"

# service_url on the alias (CP->GW control); data-plane endpoints on localhost so the derived vhost is
# 'localhost' and clients hit the GW's mapped host port with no Host-header munging (T1.4 vhost finding).
[[apim.gateway.environment]]
name = "Default"
type = "hybrid"
gateway_type = "Regular"
provider = "wso2"
display_in_api_console = true
show_as_token_endpoint_url = true
service_url = "https://gateway:9443/services/"
username = "${admin.username}"
password = "${admin.password}"
ws_endpoint = "ws://localhost:9099"
wss_endpoint = "wss://localhost:8099"
http_endpoint = "http://localhost:8280"
https_endpoint = "https://localhost:8243"

# ACP is the event-hub source (its own JMS broker + binary/thrift receiver).
[apim.event_hub]
enable = true
username = "$ref{super_admin.username}"
password = "$ref{super_admin.password}"
service_url = "https://acp:9443/services/"
event_listening_endpoints = ["tcp://acp:5672"]

[[apim.event_hub.publish.url_group]]
urls = ["tcp://acp:9611"]
auth_urls = ["ssl://acp:9711"]
