# Extra overlay shared by the mutual-SSL, WebSocket-CORS, and global REST-CORS scenarios, merged on top of the
# shared `basic` overlay. The global CORS settings are deliberately confined to this isolated block; the default
# REST-CORS contract is tested in a separate block with no overlay. The existing WebSocket assertions continue
# to pin allowed.example.com, no-Origin, and evil.example.com behavior; localhost is added as another allowed
# origin for the REST global-CORS scenario, not as a replacement for those checks.

# --- mutual-SSL: when a client cert is uploaded to an API, APIM adds it to the gateway trust store and the
# passthrough HTTPS listener picks it up on its next dynamic-SSL-profile read (default 600000 ms = 10 min, far
# too long for a test). Shrink it to 10s so an uploaded client cert is honoured within seconds.
# (SSLVerifyClient already defaults to "optional" on the 8243 listener, so no other change is needed.)
[transport.http.listener.ssl_profile]
read_interval = "10000"

# --- Global REST CORS and WebSocket CORS. The REST scenario verifies the legacy gateway-wide localhost origin
# and credential behavior using an API with no per-API CORS configuration. WebSocket validation is OFF by default
# (unlike REST); its gateway-wide toggle and explicit allow-list permit allowed/disallowed handshake assertions.
[apim.cors]
allow_origins = ["http://allowed.example.com", "http://localhost"]
allow_methods = ["GET", "PUT", "POST", "DELETE", "PATCH", "OPTIONS"]
allow_headers = ["authorization", "Access-Control-Allow-Origin", "Content-Type", "SOAPAction", "Authorization"]
allow_credentials = true
enable_validation_for_ws = true
