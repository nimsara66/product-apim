# Feature-specific TOML overlay for the IntegrationV2-ApplicationAttributes block.
#
# Merged ON TOP of the shared `basic` overlay (which is itself merged onto the product distribution
# deployment.toml) via the block's `tomlExtraOverlayPath` parameter — so only the extra keys this feature
# needs live here; everything else (DB, ports, gateway wiring) is inherited.
#
# Ports the config of the legacy ApplicationAttributesTestCase:
#   - [apim.jwt] enable = true : turns on backend JWT generation, so the gateway injects the
#     X-JWT-Assertion header (carrying the application-attribute claims) towards the backend.
#   - [[apim.devportal.application_attributes]] : declares a custom application attribute
#     ("External Reference Id"). required=true means every Developer Portal application creation in this
#     block must supply it (this is also what makes the "reject create without the attribute" negative real).
#   - [apim.jwt] enable_user_claims = true : the gateway JWTGenerator retrieves the resource owner's local
#     user-store claims and includes them in the backend JWT. Only affects tokens carrying a user (password
#     grant) — client-credentials/APPLICATION tokens have no user, so the block's other scenarios are unaffected.
#     Surfaces the user-profile claims (givenname/lastname/mobile/organization) set via setUserClaimValue,
#     WITHOUT a per-service-provider requested-claims SOAP round-trip.

[apim.jwt]
enable = true
encoding = "base64"
claim_dialect = "http://wso2.org/claims"
header = "X-JWT-Assertion"
signing_algorithm = "SHA256withRSA"
enable_user_claims = true
claims_extractor_impl = "org.wso2.carbon.apimgt.impl.token.DefaultClaimsRetriever"

# The backend-JWT subject/enduser defaults to a pseudonymous UUID (service_provider.use_username_as_sub_claim =
# false), which the claims retriever cannot resolve back to a user-store entry — so no user-profile claims are
# retrieved. Using the real username as the sub lets DefaultClaimsRetriever look the user up and fetch their
# local claims. Only the sub/enduser representation changes (still tenant-scoped); default claims are unaffected.
[service_provider]
use_username_as_sub_claim = true

[[apim.devportal.application_attributes]]
required = true
hidden = false
name = "External Reference Id"
description = "External Reference Id"
