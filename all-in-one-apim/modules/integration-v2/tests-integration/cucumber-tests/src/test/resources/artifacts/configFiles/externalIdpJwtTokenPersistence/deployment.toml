# Isolated overlay for re-running ExternalIdpJwtRunner with OAuth token persistence enabled.
# Keep the external-IdP backend-JWT settings identical to externalIdpJwt/deployment.toml, then add the
# persistence setting exercised by the legacy ExternalIDPJWTTestSuite persistence configuration.

[apim.jwt]
enable = true
encoding = "base64"
claim_dialect = "http://wso2.org/claims"
header = "X-JWT-Assertion"

[apim.jwt.gateway_generator]
excluded_claims = ["http://idp.org/claims/mobileno"]

[oauth.token_persistence]
enable = true
