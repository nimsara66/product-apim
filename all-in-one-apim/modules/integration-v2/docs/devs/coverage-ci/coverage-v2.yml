# v2 integration coverage → product-apim Codecov project, PER-PR (TEMPLATE).
#
# Mirrors the legacy mechanism: the legacy "APIM builder" (.github/workflows/maven.yml) runs the legacy
# TestNG integration suite on every PR and uploads coverage to the product-apim Codecov project under flag
# `integration_tests`. This workflow does the SAME on the same trigger for the v2 Testcontainers lane, and
# uploads under a DIFFERENT flag `integration-v2_tests` — so both land on the same PR commit in the same
# project as two distinct flags (Codecov keeps them side by side; neither clobbers the other).
#
# PLACEMENT: product-apim repo .github/workflows/. Kept here as a reviewed template.
# (Alternative: add this as an extra job inside maven.yml so it's literally the same builder — same effect.)

name: APIM v2 Integration Coverage

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    branches:
      - master

# Own concurrency group (distinct from the legacy builder's) so a new push cancels the superseded v2 run.
concurrency:
  group: coverage-v2-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  v2-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 1. Build product + the all-in-one distribution zip (the source of report class files).
      - name: Build product-apim
        working-directory: all-in-one-apim
        run: mvn -B clean install -DskipTests

      # 2. Run the v2 integration suite with coverage ON.
      #    Heavy (boots a full server per block). If per-PR wall-clock is a concern, shard like the legacy
      #    group1-4 matrix — e.g. a matrix over block subsets via IT_FEATURE_PATHS / per-block suites.
      - name: v2 integration tests (coverage on)
        working-directory: all-in-one-apim/modules/integration-v2
        run: |
          mvn -B -pl tests-integration/cucumber-tests -am \
            -Dapim.coverage=true \
            -Dsurefire.suite.xml=testng-v2.xml test

      - name: List coverage report
        if: always()
        run: find . -path '*coverage/output/txt*' -name '*.xml'

      # 3. Upload to product-apim's own Codecov project (default slug = this repo), flag integration-v2_tests.
      - name: Upload v2 integration coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: all-in-one-apim/modules/integration-v2/tests-integration/cucumber-tests/target/coverage/output/txt
          flags: integration-v2_tests
