# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: false
  high_level_summary_in_walkthrough: false
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
chat:
  auto_reply: true
knowledge_base:
  code_guidelines:
    filePatterns:
      - files: ".claude/rules/integration-tests.md"
        applyTo: "all-in-one-apim/modules/integration/tests-integration/**/*"
      - files: ".claude/rules/integration-tests.md"
        applyTo: "all-in-one-apim/modules/integration-v2/tests-integration/cucumber-tests/**/*"
